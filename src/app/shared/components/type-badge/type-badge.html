@if (size() === 'dot') {
  <span
    class="type-dot"
    role="img"
    [style.--type-color]="color()"
    [attr.title]="name() | titlecase"
    [attr.aria-label]="name() | titlecase"
  ></span>
} @else {
  <span
    class="badge type-badge capitalize"
    [class.type-badge--md]="size() === 'md'"
    [style.--type-color]="color()"
  >
    <span class="type-badge__dot" aria-hidden="true"></span>
    {{ name() }}
  </span>
}
