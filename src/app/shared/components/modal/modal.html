@if (open()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-7 bg-black/60 backdrop-blur-xs"
    (click)="onBackdropClick()"
    role="presentation"
  >
    <div
      role="dialog"
      aria-modal="true"
      class="flex flex-col max-h-full w-full max-w-8/10 overflow-hidden bg-brand-surface border border-solid border-brand-line rounded-2xl shadow-2xl"
      [attr.aria-label]="title()"
      (click)="$event.stopPropagation()"
    >
      <div class="flex items-center justify-between gap-4 pt-4 px-5 pb-3">
        <h2 class="font-bold tracking-tight text-brand-text">{{ title() }}</h2>
        <button
          type="button"
          (click)="emitClose()"
          class="size-7 text-brand-muted bg-black/5 border border-solid border-brand-line cursor-pointer transition-colors rounded-lg hover:text-brand-text hover:border-brand-red"
          aria-label="Close"
        >
          <i class="pi pi-times"></i>
        </button>
      </div>

      <div class="pt-2 px-5 pb-4 border-b border-solid border-b-brand-line empty:hidden">
        <ng-content select="[modal-toolbar]"></ng-content>
      </div>

      <div class="flex-1 min-h-0 overflow-y-auto">
        <ng-content></ng-content>
      </div>

      <div class="px-3.5 py-5 border-t border-solid border-t-brand-line empty:hidden">
        <ng-content select="[modal-footer]"></ng-content>
      </div>
    </div>
  </div>
}
