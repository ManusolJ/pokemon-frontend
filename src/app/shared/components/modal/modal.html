<dialog
  #dialog
  class="modal"
  [class.modal--sm]="size() === 'sm'"
  [attr.aria-labelledby]="titleId"
  (cancel)="onCancel($event)"
  (click)="onDialogClick($event)"
>
  @if (open()) {
    <div class="flex max-h-[inherit] flex-col">
      <header class="flex items-center justify-between gap-4 px-5 pt-4 pb-3">
        <h2 [id]="titleId" class="text-lg font-bold tracking-tight text-content">{{ title() }}</h2>
        @if (dismissable()) {
          <button
            type="button"
            (click)="emitClose()"
            class="icon-btn icon-btn-sm -mr-1.5"
            aria-label="Close"
          >
            <i class="pi pi-times" aria-hidden="true"></i>
          </button>
        }
      </header>

      <div class="border-b border-line px-5 pt-1 pb-4 empty:hidden">
        <ng-content select="[modal-toolbar]" />
      </div>

      <div class="min-h-0 flex-1 overflow-y-auto">
        <ng-content />
      </div>

      <footer class="border-t border-line px-5 py-4 empty:hidden">
        <ng-content select="[modal-footer]" />
      </footer>
    </div>
  }
</dialog>
