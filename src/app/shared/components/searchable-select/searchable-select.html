<div class="flex flex-col gap-1.5 relative">
  @if (label()) {
    <span class="text-xs font-bold tracking-wider uppercase text-brand-dim">{{ label() }}</span>
  }

  <button
    type="button"
    (click)="toggle()"
    class="flex items-center gap-2 w-full px-2 py-3 bg-brand-raised rounded-lg border border-solid border-brand-line text-brand-text text-sm font-semibold cursor-pointer text-left transition-colors duration-100 hover:border-brand-red/50 focus:border-brand-red/50"
  >
    @if (selected(); as option) {
      @if (option.color) {
        <span class="w-2.5 h-2.5 rounded-full shrink-0" [style.background]="option.color"></span>
      }
      @if (option.imageUrl) {
        <img
          [src]="getImgUrl(option.imageUrl)"
          [alt]="option.label"
          class="size-4.5 object-contain shrink-0"
        />
      }
      <span class="flex-1 min-w-0 overflow-hidden text-ellipsis whitespace-nowrap capitalize">{{
        option.label | nameNormalizer
      }}</span>
      @if (clearable()) {
        <button
          type="button"
          (click)="clear($event)"
          class="inline-flex items-center justify-center size-4.5 rounded-[0.3125rem] text-brand-muted bg-white/6 cursor-pointer transition-[color] duration-120 hover:text-brand-text"
          aria-label="Clear selection"
        >
          <i class="pi pi-times"></i>
        </button>
      }
    } @else {
      <span class="text-brand-dim font-medium flex-1">{{ placeholder() }}</span>
    }
    <i
      class="pi pi-chevron-down text-brand-dim shrink-0 transition-transform duration-150"
      [class.rotate-180]="open()"
    ></i>
  </button>

  @if (open()) {
    <div
      class="select__panel absolute top-[calc(100%+0.375rem)] left-0 right-0 z-40 bg-brand-surface border border-solid border-brand-line rounded-[0.625rem] overflow-hidden"
    >
      <div class="flex items-center gap-2 px-3 py-2.5 border-b border-brand-line text-brand-dim">
        <i class="pi pi-search"></i>
        <input
          type="text"
          autofocus
          [placeholder]="searchPlaceholder()"
          [value]="query()"
          (input)="onSearch($any($event.target).value)"
          class="flex-1 bg-transparent border-0 outline-0 text-brand-text text-[0.8125rem]"
        />
      </div>

      <div class="max-h-56 overflow-y-auto p-1" role="listbox">
        @if (filtered().length === 0) {
          <p class="text-center text-[0.8125rem] text-brand-dim py-6">No matches</p>
        }
        @for (opt of filtered(); track opt.value) {
          <button
            type="button"
            role="option"
            [attr.aria-selected]="opt.value === value()"
            [class.is-selected]="opt.value === value()"
            (click)="pick(opt)"
            class="select__option flex items-center gap-2.5 w-full py-1.75 px-2.5 rounded-[0.4375rem] bg-transparent text-brand-text text-left cursor-pointer transition-[background-color] duration-100 hover:bg-white/5"
          >
            @if (opt.color) {
              <span class="w-2.5 h-2.5 rounded-full shrink-0" [style.background]="opt.color"></span>
            }
            @if (opt.imageUrl) {
              <img
                [src]="getImgUrl(opt.imageUrl)"
                [alt]="opt.label"
                class="size-4.5 object-contain shrink-0"
              />
            }
            <span class="flex-1 min-w-0 flex flex-col">
              <span
                class="text-[0.8125rem] font-semibold whitespace-nowrap overflow-hidden text-ellipsis"
                [class.capitalize]="capitalize()"
              >
                {{ opt.label | nameNormalizer }}
              </span>
              @if (opt.caption) {
                <span
                  class="text-[0.6875rem] text-brand-dim whitespace-nowrap overflow-hidden text-ellipsis"
                >
                  {{ opt.caption }}
                </span>
              }
            </span>
            @if (opt.value === value()) {
              <i class="pi pi-check text-brand-red shrink-0"></i>
            }
          </button>
        }
      </div>
    </div>
  }
</div>
