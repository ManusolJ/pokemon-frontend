<nav class="w-full border-b border-line bg-bg" [attr.aria-label]="ariaLabel()">
  <ul class="page flex items-center gap-1 overflow-x-auto">
    @for (item of items(); track item.path) {
      <li class="shrink-0">
        <a
          [routerLink]="item.path"
          routerLinkActive="is-active"
          ariaCurrentWhenActive="page"
          class="tab-link"
        >
          @if (item.icon) {
            <i class="pi text-sm" [class]="item.icon" aria-hidden="true"></i>
          }
          {{ item.label }}
        </a>
      </li>
    }
  </ul>
</nav>
