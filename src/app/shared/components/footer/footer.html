<footer class="shrink-0 border-t border-line bg-bg">
  <div class="page flex h-10 items-center justify-between gap-4 text-xs text-muted">
    <span class="truncate">PokeTeam Builder is a non-commercial fan project</span>
    <button
      type="button"
      (click)="toggle()"
      [attr.aria-expanded]="expanded()"
      aria-controls="footer-content"
      class="inline-flex h-8 shrink-0 cursor-pointer items-center gap-1.5 rounded-lg px-2 font-semibold hover:bg-fill hover:text-content"
    >
      {{ expanded() ? 'Less' : 'More' }}
      <i
        class="pi pi-chevron-up text-xs transition-transform"
        [class.rotate-180]="expanded()"
        aria-hidden="true"
      ></i>
    </button>
  </div>

  <div
    id="footer-content"
    [attr.inert]="!expanded() ? '' : null"
    class="collapsible"
    [class.is-open]="expanded()"
  >
    <div>
      <div
        class="page flex flex-col gap-3 pb-5 text-sm text-muted sm:flex-row sm:items-start sm:justify-between"
      >
        <div class="flex flex-col gap-1">
          <p class="font-semibold text-content">PokeTeam Builder &copy; 2025</p>
          <p>Built by Manuel Soler Juan</p>
          <p class="flex flex-wrap gap-x-4 gap-y-1">
            <a routerLink="/about" class="link">About</a>
            <a routerLink="/contact" class="link">Contact</a>
            <a
              href="https://github.com/ManusolJ"
              target="_blank"
              rel="noopener noreferrer"
              class="link"
              >GitHub</a
            >
            <a href="mailto:manusolerj@gmail.com" class="link">manusolerj&commat;gmail.com</a>
          </p>
        </div>
        <p class="max-w-md text-xs leading-relaxed text-subtle">
          Not affiliated with Nintendo, Game Freak or The Pokémon Company. Pokémon and related
          content are &copy; their respective owners. Game data from PokeAPI.
        </p>
      </div>
    </div>
  </div>
</footer>
