<header class="sticky top-0 z-50 bg-brand-crimson shadow-lg">
  <nav
    class="mx-auto max-w-9/12 h-16 px-6 lg:px-8 flex items-center justify-between gap-8"
    aria-label="Primary"
  >
    <a routerLink="/" class="group flex items-center gap-2.5 shrink-0">
      <img
        src="/favicon.ico"
        alt="Logo"
        aria-hidden="true"
        class="w-10 h-10 transition-transform group-hover:scale-110"
      />
      <span class="text-white font-bold text-base">Pokemon Team Builder</span>
    </a>

    <ul class="flex items-center gap-2.5">
      @for (item of items; track item.path) {
        <li>
          <a [routerLink]="item.path" routerLinkActive="nav-link--active" class="nav-link">
            {{ item.label }}
          </a>
        </li>
      }
    </ul>

    <div class="flex items-center gap-2 shrink-0">
      @if (isAuthenticated) {
        @if (isAdmin()) {
          <a routerLink="/admin" routerLinkActive="nav-link--active" class="nav-link">Admin</a>
        }
        <a routerLink="/profile" routerLinkActive="nav-link--active" class="nav-link">Profile</a>
        <button type="button" (click)="logout()" class="nav-cta">Logout</button>
      } @else {
        <a routerLink="/auth/login" routerLinkActive="nav-link--active" class="nav-link">Login</a>
        <a routerLink="/auth/register" class="nav-cta">Register</a>
      }
    </div>
  </nav>
</header>
