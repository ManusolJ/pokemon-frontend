<a [routerLink]="link()" [style.--type-color]="accent()" class="card card-interactive poke-card">
  <span class="poke-card__art">
    @if (spriteUrl(); as src) {
      <img [src]="src" alt="" loading="lazy" />
    } @else {
      <span class="text-2xl font-bold text-subtle" aria-hidden="true">?</span>
    }
  </span>

  <span class="tabular text-xs font-semibold text-subtle">#{{ dex() }}</span>
  <span class="text-base font-bold capitalize text-content">{{ pokemon().name }}</span>

  <span class="mt-2 flex flex-wrap gap-1.5">
    @for (t of types(); track t.id) {
      <app-type-badge [name]="t.name" size="sm" />
    }
  </span>
</a>
