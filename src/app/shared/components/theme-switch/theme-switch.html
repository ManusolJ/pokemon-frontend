<button #trigger type="button" class="icon-btn" aria-label="Theme" [attr.popovertarget]="menuId">
  <i
    class="pi"
    [class.pi-moon]="resolved() === 'dark'"
    [class.pi-sun]="resolved() === 'light'"
    aria-hidden="true"
  ></i>
</button>

<div
  #menu
  popover
  [id]="menuId"
  class="fixed inset-auto m-0 w-40 rounded-xl border border-line bg-overlay p-1 text-content shadow-lg"
  (beforetoggle)="reposition()"
>
  <p class="eyebrow px-2.5 pt-1.5 pb-1">Theme</p>
  @for (option of options; track option.value) {
    <button
      type="button"
      class="flex h-9 w-full cursor-pointer items-center gap-2.5 rounded-lg px-2.5 text-sm hover:bg-fill aria-pressed:font-semibold aria-pressed:text-accent"
      [attr.aria-pressed]="preference() === option.value"
      (click)="select(option.value)"
    >
      <i class="pi text-sm" [class]="option.icon" aria-hidden="true"></i>
      {{ option.label }}
    </button>
  }
</div>
