<app-modal [open]="open()" title="Choose an item" (closed)="closed.emit()">
  <div modal-toolbar class="flex items-center gap-2.5 flex-wrap">
    <div
      class="flex flex-1 min-w-48 items-center gap-2 px-2.5 py-3 bg-brand-raised border border-solid border-brand-line rounded-xl text-brand-dim transition-colors focus-within:border-brand-red/50"
    >
      <i class="pi pi-search"></i>
      <input
        #nameSearch
        type="text"
        autofocus
        placeholder="Search by item name…"
        class="flex-1 bg-transparent border-0 outline-0 text-brand-text text-sm"
        [value]="query()"
        (input)="onSearch(nameSearch.value)"
      />
    </div>

    <button
      type="button"
      (click)="clearFilters()"
      [disabled]="!hasFilters()"
      class="seg-btn inline-flex items-center gap-1.5 px-3 py-2.5 rounded-lg text-xs font-semibold text-brand-muted bg-brand-raised border border-solid border-brand-line cursor-pointer transition-colors hover:text-brand-text disabled:opacity-40 disabled:cursor-not-allowed"
    >
      <i class="pi pi-filter-slash"></i>
      Clear filters
    </button>
  </div>

  <div class="px-3 pt-3 pb-3">
    @if (currentItemId() !== null) {
      <button
        type="button"
        (click)="clearItem()"
        class="flex items-center gap-2 w-full px-3 py-2.5 mb-3 bg-transparent border border-dashed border-brand-line rounded-lg text-brand-dim text-sm cursor-pointer transition-colors hover:text-brand-text hover:border-brand-red"
      >
        <i class="pi pi-times"></i>
        Remove held item
      </button>
    }

    @if (loading()) {
      <div class="grid grid-cols-[repeat(auto-fill,minmax(220px,1fr))] gap-2.5">
        @for (skeleton of skeletons(); track $index) {
          <p-skeleton height="4.5rem"></p-skeleton>
        }
      </div>
    } @else if (items().length === 0) {
      <p class="text-center text-brand-dim py-10 text-sm">No items match those filters.</p>
    } @else {
      <div class="grid grid-cols-[repeat(auto-fill,minmax(220px,1fr))] gap-2.5">
        @for (item of items(); track item.id) {
          <button
            type="button"
            (click)="onPick(item)"
            [class.is-current]="isCurrent(item)"
            class="item-row flex items-start gap-2.5 px-3 py-2.5 rounded-lg bg-brand-raised border border-solid border-brand-line text-left text-brand-text cursor-pointer transition-colors"
          >
            <span class="size-9 shrink-0 flex items-center justify-center">
              @if (item.spriteUrl) {
                <img
                  [src]="getImgUrl(item.spriteUrl)"
                  [alt]="item.name"
                  loading="lazy"
                  class="w-full h-full object-contain"
                />
              }
            </span>
            <span class="flex flex-col gap-0.5 flex-1 min-w-0">
              <span class="font-semibold text-sm truncate">
                {{ item.name | nameNormalizer | titlecase }}
              </span>
              <span class="text-[0.6875rem] text-brand-dim leading-snug line-clamp-2">
                {{ item.shortEffect || '—' }}
              </span>
            </span>
          </button>
        }
      </div>
    }
  </div>

  <div modal-footer>
    <p-paginator
      class="paginator-dark"
      [rows]="pageSize"
      [pageLinkSize]="5"
      [alwaysShow]="true"
      [totalRecords]="totalRecords()"
      [first]="currentPage() * pageSize"
      (onPageChange)="onPageChange($event)"
    />
  </div>
</app-modal>
