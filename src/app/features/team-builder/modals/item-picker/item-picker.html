<app-modal [open]="open()" title="Choose an item" (closed)="closed.emit()">
  <div modal-toolbar class="flex items-center gap-2.5 flex-wrap">
    <label class="input-icon min-w-48 flex-1">
      <span class="sr-only">Search</span>
      <i class="pi pi-search" aria-hidden="true"></i>
      <input
        #nameSearch
        type="text"
        autofocus
        placeholder="Search by item name…"
        class="input"
        [value]="query()"
        (input)="onSearch(nameSearch.value)"
      />
    </label>

    <button
      type="button"
      (click)="clearFilters()"
      [disabled]="!hasFilters()"
      class="btn btn-secondary btn-sm"
    >
      <i class="pi pi-filter-slash text-xs" aria-hidden="true"></i>
      Clear filters
    </button>
  </div>

  <div class="px-3 pt-3 pb-3">
    @if (currentItemId() !== null) {
      <button
        type="button"
        (click)="clearItem()"
        class="btn btn-ghost btn-block justify-start border-dashed border-line-strong mb-3"
      >
        <i class="pi pi-times text-xs" aria-hidden="true"></i>
        Remove held item
      </button>
    }

    @if (loading()) {
      <div class="grid grid-cols-[repeat(auto-fill,minmax(min(100%,200px),1fr))] gap-2.5">
        @for (skeleton of skeletons(); track $index) {
          <p-skeleton height="4.5rem"></p-skeleton>
        }
      </div>
    } @else if (items().length === 0) {
      <p class="text-center text-subtle py-10 text-sm">No items match those filters.</p>
    } @else {
      <div class="grid grid-cols-[repeat(auto-fill,minmax(min(100%,200px),1fr))] gap-2.5">
        @for (item of items(); track item.id) {
          <button
            type="button"
            (click)="onPick(item)"
            [class.is-current]="isCurrent(item)"
            class="item-row flex items-start gap-2.5 px-3 py-2.5 rounded-lg bg-raised border border-line text-left text-content cursor-pointer transition-colors"
          >
            <span class="size-9 shrink-0 flex items-center justify-center">
              @if (item.spriteUrl) {
                <img
                  [src]="getImgUrl(item.spriteUrl)"
                  [alt]="item.name"
                  loading="lazy"
                  class="w-full h-full object-contain"
                />
              }
            </span>
            <span class="flex flex-col gap-0.5 flex-1 min-w-0">
              <span class="font-semibold text-sm truncate">
                {{ item.name | nameNormalizer | titlecase }}
              </span>
              <span class="text-xs text-subtle leading-snug line-clamp-2">
                {{ item.shortEffect || '—' }}
              </span>
            </span>
          </button>
        }
      </div>
    }
  </div>

  <div modal-footer>
    <p-paginator
      class="list-paginator"
      [rows]="pageSize"
      [pageLinkSize]="5"
      [alwaysShow]="true"
      [totalRecords]="totalRecords()"
      [first]="currentPage() * pageSize"
      (onPageChange)="onPageChange($event)"
    />
  </div>
</app-modal>
