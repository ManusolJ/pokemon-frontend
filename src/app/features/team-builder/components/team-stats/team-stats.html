@if (teamSize() === 0) {
  <div class="flex h-full flex-col items-center justify-center gap-2.5 text-center text-muted">
    <span
      class="inline-flex items-center justify-center size-11 rounded-xl bg-fill border border-solid border-line text-subtle"
      aria-hidden="true"
    >
      <i class="pi pi-chart-bar text-lg"></i>
    </span>
    <p class="text-sm font-semibold text-content">No team yet</p>
    <p class="text-xs max-w-64 leading-5">
      Add Pokémon in the Builder tab to see combined base-stat totals.
    </p>
  </div>
} @else {
  <div class="flex flex-col gap-2.5 h-full">
    <div class="grid grid-cols-2 gap-1.5 flex-1 min-h-0">
      @for (row of rows(); track row.key) {
        <div class="stat-card" [attr.data-tone]="row.tone">
          <div class="flex items-baseline justify-between gap-2">
            <span class="text-xs font-bold uppercase tracking-wider text-subtle">
              {{ row.label }}
            </span>
            <span class="tabular text-xs tabular-nums text-subtle"> avg {{ row.average }} </span>
          </div>
          <div class="tabular text-xl font-bold tabular-nums text-content leading-none">
            {{ row.total }}
          </div>
          <span class="stat-bar">
            <span class="stat-bar__fill" [style.width.%]="row.fillPercent"></span>
          </span>
        </div>
      }
    </div>

    <div class="flex items-baseline justify-between border-t border-line pt-2.5">
      <span class="text-xs font-bold uppercase tracking-wide text-subtle"> Team base total </span>
      <span class="tabular text-sm font-bold tabular-nums text-content">
        {{ grandTotal() }}
        <span class="font-sans font-normal text-subtle">· {{ teamSize() }} mon</span>
      </span>
    </div>
  </div>
}
