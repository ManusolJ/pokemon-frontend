@if (member(); as m) {
  <div class="flex flex-col gap-3">
    <div class="rows flex flex-col gap-2">
      @for (s of stats; track s.key) {
        <div
          class="grid grid-cols-[3rem_2.25rem_1fr_auto] sm:grid-cols-[3.5rem_2.5rem_1fr_auto] items-center gap-2 sm:gap-3"
        >
          <span class="row__label inline-flex items-center gap-1 text-xs font-bold text-muted">
            {{ s.short }}
            @if (natureUp(s.key)) {
              <span class="text-xs leading-none text-fx-positive" aria-label="Nature boosted">
                ▲
              </span>
            }
            @if (natureDown(s.key)) {
              <span class="text-xs leading-none text-fx-negative" aria-label="Nature lowered">
                ▼
              </span>
            }
          </span>

          <span
            class="row__stat tabular text-right text-sm font-bold text-content"
            [class.row__stat--up]="natureUp(s.key)"
            [class.row__stat--down]="natureDown(s.key)"
          >
            {{ calculatedStats()?.[s.key] ?? '—' }}
          </span>

          <span class="h-2 rounded-full bg-fill-strong overflow-hidden block" aria-hidden="true">
            <span class="row__bar-fill block h-full" [style.width.%]="fillPct(m.evs[s.key])"></span>
          </span>

          <span class="inline-flex items-center gap-1 sm:gap-1.5">
            <button
              type="button"
              (click)="step(s.key, stepNeg)"
              class="stepper inline-flex size-7 cursor-pointer items-center justify-center rounded-md border border-line bg-surface text-sm leading-none text-muted"
              [attr.aria-label]="'Decrease ' + s.label + ' EVs'"
            >
              −
            </button>
            <span
              class="row__value tabular w-8 text-center text-xs text-subtle"
              [class.is-active]="m.evs[s.key] > 0"
            >
              {{ m.evs[s.key] }}
            </span>
            <button
              type="button"
              (click)="step(s.key, stepPos)"
              class="stepper inline-flex size-7 cursor-pointer items-center justify-center rounded-md border border-line bg-surface text-sm leading-none text-muted"
              [attr.aria-label]="'Increase ' + s.label + ' EVs'"
            >
              +
            </button>
            <button
              type="button"
              (click)="max(s.key)"
              class="stepper stepper--max inline-flex h-7 cursor-pointer items-center justify-center rounded-md border border-line bg-surface px-2 text-xs font-bold leading-none text-muted"
              [attr.aria-label]="'Max EVs in ' + s.label"
            >
              MAX
            </button>
          </span>
        </div>
      }
    </div>

    <footer class="spread__footer flex flex-col gap-2 border-t border-line pt-3">
      <div class="flex items-center gap-3">
        <span class="eyebrow">EVs used</span>
        <span
          class="spread__used tabular text-sm text-muted"
          [class.is-over]="overBudget()"
          aria-live="polite"
        >
          <strong class="font-bold text-content">{{ usedEvs() }}</strong> / {{ evTotalMax }}
        </span>
        <button type="button" (click)="resetAll()" class="btn btn-ghost btn-sm ml-auto">
          Reset all
        </button>
      </div>
      <span class="h-1.5 rounded-full bg-fill-strong overflow-hidden block" aria-hidden="true">
        <span class="spread__budget-fill block h-full" [style.width.%]="budgetPct()"></span>
      </span>
    </footer>
  </div>
} @else {
  <div class="flex flex-col items-center justify-center gap-2.5 text-center py-8 px-4 text-muted">
    <span
      class="inline-flex size-10 items-center justify-center rounded-xl bg-fill text-subtle"
      aria-hidden="true"
    >
      <i class="pi pi-chart-bar"></i>
    </span>
    <p class="text-sm font-bold text-content">No Pokémon selected</p>
    <p class="text-sm max-w-64 leading-6">Pick a slot to distribute EVs.</p>
  </div>
}
