<div class="flex items-center justify-between">
  <h2 class="eyebrow">Team</h2>
  <span class="tabular text-xs font-semibold text-subtle">{{ filledCount() }} / 6</span>
</div>

<div class="grid flex-1 auto-rows-[minmax(4rem,1fr)] grid-cols-2 gap-2 sm:grid-cols-3">
  @for (m of members(); track $index; let i = $index) {
    @if (m) {
      <div class="group relative">
        <button
          type="button"
          (click)="slotSelect.emit(i)"
          [style.--accent]="accentFor(m)"
          [class.is-active]="activeIndex() === i"
          class="slot slot--filled size-full cursor-pointer overflow-hidden rounded-xl border border-line text-left"
          [attr.aria-label]="'Edit ' + displayNameFor(m)"
          [attr.aria-current]="activeIndex() === i ? 'true' : null"
        >
          <span class="slot__body">
            <span class="slot__art" [class.slot__art--shiny]="m.shiny">
              <img [src]="getImgUrl(spriteFor(m))" [alt]="m.name" loading="lazy" />
              @if (m.shiny) {
                <span class="slot__sparkle" aria-hidden="true">&#x2726;</span>
              }
            </span>

            <span class="slot__info">
              <span class="slot__dex tabular text-xs text-subtle"
                >№{{ m.species.nationalDexNumber }}</span
              >
              <span class="slot__name truncate font-bold capitalize text-content">{{
                displayNameFor(m)
              }}</span>
              <span class="max-w-full truncate text-xs capitalize text-muted">{{
                m.item ? (m.item.name | nameNormalizer) : 'No item'
              }}</span>
              <span class="slot__types">
                @for (t of typesOf(m); track t.id) {
                  <app-type-badge [name]="t.name" size="sm" />
                }
              </span>
              <span class="slot__dots">
                @for (t of typesOf(m); track t.id) {
                  <app-type-badge [name]="t.name" size="dot" />
                }
              </span>
            </span>
          </span>
        </button>

        <button
          type="button"
          (click)="onRemove($event, i)"
          class="icon-btn icon-btn-sm icon-btn-danger remove-btn absolute top-1 right-1 z-2"
          [attr.aria-label]="'Remove ' + displayNameFor(m) + ' from the team'"
        >
          <i class="pi pi-times text-xs" aria-hidden="true"></i>
        </button>
      </div>
    } @else {
      <button
        type="button"
        (click)="slotAdd.emit(i)"
        class="slot slot--empty size-full cursor-pointer rounded-xl border border-dashed border-line-strong text-muted"
      >
        <span class="slot__body slot__body--empty">
          <span
            class="slot__plus inline-flex shrink-0 items-center justify-center rounded-full bg-fill"
            aria-hidden="true"
          >
            <i class="pi pi-plus text-xs"></i>
          </span>
          <span class="text-sm font-semibold">Add Pokémon</span>
        </span>
      </button>
    }
  }
</div>
