<app-list-shell
  noun="natures"
  title="Natures"
  [total]="total()"
  [loading]="loading()"
  [page]="page()"
  [pageSize]="pageSize"
  [totalPages]="totalPages()"
>
  <app-filter-sidebar sidebar [fields]="fields" (filterChange)="onFilterChange($event)" />

  <div grid class="nature-grid">
    @for (nature of items(); track nature.id) {
      <article class="card p-5">
        <h3 class="font-bold capitalize text-content">{{ nature.name | nameNormalizer }}</h3>
        @if (isNeutral(nature)) {
          <p class="mt-3 text-sm text-muted">Neutral — no stat changes</p>
        } @else {
          <dl class="mt-3 flex flex-col gap-1.5 text-sm">
            <div class="flex items-center gap-1.5 font-semibold text-success">
              <dt class="sr-only">Raises</dt>
              <i class="pi pi-arrow-up text-xs" aria-hidden="true"></i>
              <dd>{{ nature.increasedStat | nameNormalizer | titlecase }}</dd>
            </div>
            <div class="flex items-center gap-1.5 font-semibold text-danger">
              <dt class="sr-only">Lowers</dt>
              <i class="pi pi-arrow-down text-xs" aria-hidden="true"></i>
              <dd>{{ nature.decreasedStat | nameNormalizer | titlecase }}</dd>
            </div>
          </dl>
        }
      </article>
    }
  </div>
</app-list-shell>
