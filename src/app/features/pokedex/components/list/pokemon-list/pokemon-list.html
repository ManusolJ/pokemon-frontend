<app-list-shell
  noun="Pokémon"
  title="Pokédex"
  [total]="total()"
  [loading]="loading()"
  [page]="page()"
  [pageSize]="pageSize"
  [totalPages]="totalPages()"
>
  <app-filter-sidebar sidebar [fields]="fields()" (filterChange)="onFilterChange($event)" />

  <div toolbar class="segmented" role="group" aria-label="Sort by">
    @for (sortOption of sorts; track sortOption.field) {
      <button
        type="button"
        (click)="setSort(sortOption.field)"
        [attr.aria-pressed]="sort() === sortOption.field"
        class="segmented-item"
      >
        {{ sortOption.label }}
      </button>
    }
  </div>

  <div grid class="poke-grid">
    @for (pokemon of items(); track pokemon.id) {
      <app-pokemon-card [pokemon]="pokemon" />
    }
  </div>
</app-list-shell>
