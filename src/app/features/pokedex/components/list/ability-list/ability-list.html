<app-list-shell
  title="Abilities"
  noun="abilities"
  [total]="total()"
  [page]="page()"
  [pageSize]="pageSize"
  [loading]="loading()"
  [totalPages]="totalPages()"
>
  <app-filter-sidebar sidebar [fields]="fields" (filterChange)="onFilterChange($event)" />

  <div grid class="info-grid">
    @for (ability of items(); track ability.id) {
      <article class="card p-5">
        <h3 class="font-bold capitalize text-content">{{ ability.name }}</h3>
        <p class="mt-2 line-clamp-3 text-sm leading-relaxed text-muted">
          {{ ability.shortEffect || ability.effect || ability.flavorText }}
        </p>
      </article>
    }
  </div>
</app-list-shell>
