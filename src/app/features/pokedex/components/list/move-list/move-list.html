<app-list-shell
  title="Moves"
  noun="moves"
  [total]="total()"
  [loading]="loading()"
  [page]="page()"
  [pageSize]="pageSize"
  [totalPages]="totalPages()"
  (pageChange)="onPageChange($event)"
>
  <app-filter-sidebar sidebar [fields]="fields()" (filterChange)="onFilterChange($event)" />

  <div grid class="move-grid">
    @for (move of items(); track move.id) {
      <button
        type="button"
        (click)="onSelect(move.id)"
        class="card card-interactive flex h-16 w-full cursor-pointer items-center justify-between gap-3 px-4 text-left"
      >
        <span class="min-w-0 truncate font-semibold text-content">
          {{ move.name | nameNormalizer | titlecase }}
        </span>
        <app-type-badge [name]="move.type.name" size="sm" />
      </button>
    }
  </div>
</app-list-shell>
