<app-list-shell
  title="Moves"
  noun="moves"
  [skeletonCount]="skeletonCount"
  [total]="total()"
  [loading]="loading()"
  [page]="page()"
  [totalPages]="totalPages()"
  (pageChange)="onPageChange($event)"
>
  <app-filter-sidebar sidebar [fields]="fields()" (filterChange)="onFilterChange($event)" />

  <div grid class="move-grid">
    @for (move of items(); track move.id) {
      <button
        type="button"
        (click)="onSelect(move.id)"
        class="flex h-20 w-full items-center justify-between gap-3 rounded-2xl border border-brand-line bg-brand-surface p-4 text-left transition hover:-translate-y-0.5 hover:border-brand-red/40"
      >
        <h3 class="text-brand-text min-w-0 font-bold">
          {{ move.name | nameNormalizer | titlecase }}
        </h3>
        <app-type-badge [name]="move.type.name" size="sm" />
      </button>
    }
  </div>
</app-list-shell>
