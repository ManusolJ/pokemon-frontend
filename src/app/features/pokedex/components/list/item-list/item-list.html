<app-list-shell
  title="Items"
  noun="items"
  [total]="total()"
  [loading]="loading()"
  [page]="page()"
  [pageSize]="pageSize"
  [totalPages]="totalPages()"
>
  <app-filter-sidebar sidebar [fields]="fields" (filterChange)="onFilterChange($event)" />

  <div grid class="item-grid">
    @for (item of items(); track item.id) {
      <article class="card flex gap-3 p-4">
        @if (item.spriteUrl) {
          <img
            [src]="getItemSpriteUrl(item)"
            alt=""
            loading="lazy"
            class="size-12 shrink-0 object-contain [image-rendering:pixelated]"
          />
        }
        <div class="min-w-0">
          <h3 class="font-bold capitalize text-content">{{ item.name | nameNormalizer }}</h3>
          @if (item.category) {
            <p class="eyebrow mt-0.5">{{ item.category }}</p>
          }
          <p class="mt-1.5 line-clamp-2 text-sm leading-relaxed text-muted">
            {{ item.shortEffect || item.effect || item.flavorText }}
          </p>
        </div>
      </article>
    }
  </div>
</app-list-shell>
