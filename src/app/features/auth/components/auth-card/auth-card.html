<div class="flex w-full max-w-md flex-col items-center">
  <svg
    viewBox="0 0 100 100"
    width="64"
    height="64"
    class="pokeball relative z-10"
    aria-hidden="true"
  >
    <circle cx="50" cy="50" r="46" class="pokeball__outline" stroke-width="4" />
    <path d="M 4 50 A 46 46 0 0 1 96 50 Z" class="pokeball__top" />
    <path d="M 4 50 A 46 46 0 0 0 96 50 Z" class="pokeball__bottom" />
    <line x1="4" y1="50" x2="96" y2="50" class="pokeball__outline" stroke-width="4" />
    <circle cx="50" cy="50" r="13" class="pokeball__button-ring" />

  </svg>

  <div class="card -mt-8 w-full px-6 pt-12 pb-8 shadow-md sm:px-10">
    <h1 class="text-center text-2xl font-bold tracking-tight text-content">{{ title() }}</h1>
    @if (subtitle()) {
      <p class="mt-1 text-center text-sm text-muted">{{ subtitle() }}</p>

      <ng-content />

  </div>
