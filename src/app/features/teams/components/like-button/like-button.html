<button
  type="button"
  class="like-btn"
  [class.like-btn--sm]="size() === 'sm'"
  [attr.aria-pressed]="liked()"
  [attr.aria-label]="label()"
  (click)="onClick($event)"
>
  <i class="pi" [class.pi-heart-fill]="liked()" [class.pi-heart]="!liked()" aria-hidden="true"></i>
  @if (formattedCount() !== null) {
    <span class="tabular">{{ formattedCount() }}</span>
  }
</button>
