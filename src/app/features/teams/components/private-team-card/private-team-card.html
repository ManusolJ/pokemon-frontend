<article
  class="card card-interactive team-card flex h-full flex-col gap-4 p-5"
  [class.is-empty]="isEmpty()"
>
  <div class="flex min-w-0 flex-col gap-1.5">
    <app-visibility-badge [isPublic]="isPublic()" />
    <h3 class="truncate text-lg font-bold tracking-tight text-content">
      <a [routerLink]="[teamsMyPath, team().id]" class="card-link">{{ team().name }}</a>
    </h3>
    <p class="text-xs text-muted">
      Edited {{ editedLabel() }} · {{ filled() }}/{{ slotCount }} slots
    </p>
  </div>

  <app-team-sprite-row [sprites]="team().pokemonSprites" [size]="52" />

  <footer class="relative z-10 mt-auto flex flex-wrap items-center gap-1.5">
    <button type="button" class="btn btn-secondary btn-sm" (click)="emit($event, 'edit')">
      <i class="pi pi-pen-to-square text-xs" aria-hidden="true"></i>Edit
    </button>

    <button
      type="button"
      class="btn btn-secondary btn-sm"
      [disabled]="pending()"
      [attr.aria-busy]="pending()"
      (click)="emit($event, 'toggle-visibility')"
    >
      <i
        class="pi text-xs"
        [class.pi-lock]="isPublic()"
        [class.pi-globe]="!isPublic()"
        aria-hidden="true"
      ></i>
      {{ publishLabel() }}
    </button>

    <span class="flex-1"></span>

    <button
      type="button"
      class="icon-btn icon-btn-sm"
      (click)="emit($event, 'share')"
      [attr.aria-label]="copied() ? 'Link copied' : 'Copy share link for ' + team().name"
    >
      <i
        class="pi text-sm"
        [class.pi-check]="copied()"
        [class.text-success]="copied()"
        [class.pi-link]="!copied()"
        aria-hidden="true"
      ></i>
    </button>

    <button
      type="button"
      class="icon-btn icon-btn-sm icon-btn-danger"
      (click)="emit($event, 'delete')"
      [attr.aria-label]="'Delete ' + team().name"
    >
      <i class="pi pi-trash text-sm" aria-hidden="true"></i>
    </button>
  </footer>
</article>
