<app-list-shell
  [total]="total()"
  title="Community teams"
  noun="teams"
  [hideSidebar]="true"
  [page]="page()"
  [pageSize]="pageSize"
  [loading]="loading()"
  [totalPages]="totalPages()"
  (pageChange)="onPageChange($event)"
>
  <div toolbar class="flex min-w-0 flex-wrap items-center gap-2">
    <label class="input-icon min-w-48 flex-1">
      <span class="sr-only">Search community teams</span>
      <i class="pi pi-search" aria-hidden="true"></i>
      <input
        #search
        type="search"
        autocomplete="off"
        placeholder="Search team name…"
        class="input"
        [value]="query()"
        (input)="onSearch(search.value)"
      />
    </label>

    <div class="segmented" role="group" aria-label="Sort by">
      @for (sort of sorts; track sort.id) {
        <button
          type="button"
          class="segmented-item"
          [attr.aria-pressed]="sortId() === sort.id"
          (click)="setSort(sort.id)"
        >
          {{ sort.label }}
        </button>
      }
    </div>
  </div>

  <div grid class="team-grid">
    @for (team of teams(); track team.id) {
      <app-team-card [team]="team" (likeToggle)="onLikeToggle($event)" />
    }
  </div>
</app-list-shell>
