<app-list-shell
  [total]="total()"
  title="Community teams"
  [hideSidebar]="true"
  [page]="page()"
  [pageSize]="pageSize"
  [loading]="loading()"
  [totalPages]="totalPages()"
  (pageChange)="onPageChange($event)"
>
  <div toolbar class="flex flex-wrap items-center gap-2.5">
    <label
      class="flex flex-1 min-w-48 items-center gap-2 rounded-lg border border-brand-line bg-brand-surface px-3 py-2 text-brand-dim transition-colors focus-within:border-brand-red/40"
    >
      <i class="pi pi-search text-xs"></i>
      <input
        #search
        type="text"
        autocomplete="off"
        placeholder="Search team name…"
        class="flex-1 bg-transparent text-sm text-brand-text outline-none placeholder:text-brand-dim"
        [value]="query()"
        (input)="onSearch(search.value)"
      />
    </label>

    <div class="sort-strip">
      @for (sort of sorts; track sort.id) {
        <button
          type="button"
          (click)="setSort(sort.id)"
          [class.is-active]="sortId() === sort.id"
          class="sort-btn"
        >
          {{ sort.label }}
        </button>
      }
    </div>
  </div>

  <div grid class="team-grid">
    @for (team of teams(); track team.id) {
      <app-team-card
        [team]="team"
        (selected)="onSelect($event)"
        (likeToggle)="onLikeToggle($event)"
      />
    }
  </div>
</app-list-shell>
