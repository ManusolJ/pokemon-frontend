<article class="card card-interactive team-card flex h-full flex-col gap-4 p-5">
  <div class="flex items-start gap-3">
    <div class="min-w-0 flex-1">
      <p class="mb-1 text-xs text-subtle">{{ createdLabel() }}</p>
      <h3 class="truncate text-lg font-bold tracking-tight text-content">
        <a [routerLink]="[teamsSharedPath, team().id]" class="card-link">{{ team().name }}</a>
      </h3>
    </div>

    <app-like-button
      [liked]="team().likedByCurrentUser"
      [count]="team().likeCount"
      [teamId]="team().id"
      size="sm"
      (toggled)="onLikeToggle($event)"
    />
  </div>

  <div class="flex items-center gap-2">
    <span
      class="inline-flex size-6 items-center justify-center rounded-full bg-fill-strong text-xs font-bold text-content"
      aria-hidden="true"
      >{{ ownerInitial() }}</span
    >
    <span class="text-sm font-semibold text-muted">{{ team().owner.username }}</span>
  </div>

  <app-team-sprite-row [sprites]="team().pokemonSprites" [size]="56" />
</article>
