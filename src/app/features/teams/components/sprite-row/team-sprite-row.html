<div
  class="sprite-grid"
  role="list"
  aria-label="Team Pokémon"
  [style.gap.px]="gap()"
  [style.grid-template-columns]="columns()"
>
  @for (slot of slots(); track slot.key) {
    @if (slot.url) {
      <span class="cell slot" role="listitem">
        <img [src]="slot.url" alt="" loading="lazy" />
      </span>
    } @else {
      <span
        class="cell border border-dashed border-line bg-fill-strong text-subtle"
        role="listitem"
        aria-label="Empty slot"
        >—</span
      >
    }
  }
</div>
