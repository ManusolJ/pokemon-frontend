name = "pokemon-frontend"
compatibility_date = "2026-06-01"

# Workers.dev subdomain (*.workers.dev). Disabled in prod: we serve via the
# custom domain (pokemon-team-builder.com) instead. Set to true while debugging
# if you want the workers.dev URL active.
workers_dev = false
preview_urls = false

[assets]
# Angular's build output lives here. Point Wrangler at the actual `browser/`
# directory so index.html ends up at the root of the served origin.
directory = "./dist/pokemon-team-builder/browser"

# SPA fallback: serve index.html for any path the asset server can't match,
# so client-side routes (e.g. /teams/123) work on direct navigation + refresh.
not_found_handling = "single-page-application"
